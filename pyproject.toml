[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dummy-mlwp-model"
dynamic = ["version"]
description = "A dummy deep-learning weather model: zarr in, zarr out, configured entirely by environment variables."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2025.1.0",
    "cf-xarray>=0.9",
    "zarr>=3.0",
    "fsspec>=2024.6",
    "torch>=2.4",
    "loguru>=0.7",
]

[project.optional-dependencies]
remote = ["s3fs>=2024.6", "gcsfs>=2024.6"]
# s3fs is here as well as in [remote] so the tests can check that the storage options
# we build are option names s3fs actually accepts. moto serves real S3 traffic on
# localhost, so the end-to-end S3 tests need neither network access nor credentials.
dev = ["pytest>=8.0", "ruff>=0.6", "s3fs>=2024.6", "moto[server]>=5.0"]
# Which torch build to install: exactly one of these, each from its own PyTorch index
# (see [tool.uv.sources]). Both pin the same version, so CI (cpu) tests the torch the
# image (cu124) ships. Bump them together.
cpu = ["torch==2.5.1"]
cu124 = ["torch==2.5.1"]

[project.scripts]
dummy-mlwp = "dummy_mlwp.__main__:main"

# Version comes from the git tag (e.g. v0.3.1 -> 0.3.1); untagged commits get a
# PEP 440 dev version derived from the distance to the last tag.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

# Baked into the wheel so the version survives into the container, which has no .git.
[tool.hatch.build.hooks.vcs]
version-file = "src/dummy_mlwp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dummy_mlwp"]

# uv.lock holds the resolved versions that CI and the container both install. One uv
# version everywhere (setup-uv reads it from here; the Dockerfile copies the same one),
# since another version may rewrite the lock and fail CI's up-to-date check.
[tool.uv]
required-version = "==0.12.22"
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test names and their one-line docstrings carry the intent; a full numpy docstring
# on every test would be noise.
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
