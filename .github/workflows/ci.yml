name: CI

# Push only on main: a branch with an open PR is covered by the pull_request run, and
# pushing on every branch as well ran each commit twice. Branches without a PR get no CI.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "container" is the image's own Python, read from the Dockerfile, so one job
        # always tests exactly what the container runs: that Python with the locked
        # dependencies. Further entries test other versions on top.
        python: ["container", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the git tag, so the full history and
          # tags have to be present or the build reports a bogus version.
          fetch-depth: 0

      - name: Resolve the Python version
        id: python
        run: |
          if [ "${{ matrix.python }}" = container ]; then
            version=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)
            if [ -z "$version" ]; then
              echo "::error::no 'ARG PYTHON_VERSION=' line in the Dockerfile"
              exit 1
            fi
          else
            version="${{ matrix.python }}"
          fi
          echo "Testing Python $version (matrix entry: ${{ matrix.python }})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python ${{ steps.python.outputs.version }}
        # Creates .venv and puts it on PATH for every later step. The uv version comes
        # from required-version in pyproject.toml, the cache key from uv.lock.
        # Exact version: since v8, setup-uv publishes no floating major tags.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          activate-environment: true
          enable-cache: true

      - name: Install from the lock
        # --locked fails if uv.lock has fallen behind pyproject.toml. The cpu extra is
        # the same torch version the image gets through cu124, as a CPU build; the
        # test suite runs with DEVICE=cpu, so it covers everything but the GPU path.
        run: uv sync --locked --extra cpu --extra remote --extra dev

      # The steps below call the venv's tools directly. `uv run` would work too now,
      # but it would need the same --extra flags to keep the environment as synced.

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Smoke test the CLI end to end
        run: |
          python scripts/make_test_input.py /tmp/in.zarr \
            --kind projected --levels 850 500 250
          INPUT_ZARR=/tmp/in.zarr \
          OUTPUT_ZARR=/tmp/out.zarr \
          LEVEL_COORDS=isobaricInhPa:850/500/250 \
          INPUT_VARIABLES=t2m,u10,v10,t:K@isobaricInhPa \
          OUTPUT_VARIABLES=t2m:K,tp:mm,z:m2s-2@isobaricInhPa \
          N_FORECAST_STEPS=8 \
          DEVICE=cpu \
          python -m dummy_mlwp
          python -c "import xarray as xr; print(xr.open_zarr('/tmp/out.zarr'))"
