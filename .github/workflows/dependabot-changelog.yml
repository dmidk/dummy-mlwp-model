name: Dependabot changelog

# Records each Dependabot bump under "Unreleased" in CHANGELOG.md by committing the
# entry straight onto the Dependabot PR branch. Copied from observingClouds/ecmwfspec.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  update-changelog:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: crambl/dependabot-changelog-writer@trunk
